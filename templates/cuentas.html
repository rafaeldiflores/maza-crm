<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-50 text-slate-800">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuentas MAZA — CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script>
    // Mismo candado que index.html: toda llamada lleva X-Maza-CRM (app.py).
    (() => {
      const original = window.fetch.bind(window);
      window.fetch = (url, opts = {}) => {
        const headers = new Headers(opts.headers || {});
        headers.set('X-Maza-CRM', '1');
        return original(url, { ...opts, headers });
      };
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: {
      sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
      mono: ['"JetBrains Mono"', 'monospace'],
    } } } };
  </script>
</head>
<body class="min-h-full font-sans antialiased bg-slate-50">

  <header class="sticky top-0 z-30 border-b border-slate-200 bg-white/90 backdrop-blur px-4 py-3">
    <div class="mx-auto flex max-w-7xl items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <a href="/" class="p-2 rounded-xl border border-slate-200 hover:bg-slate-100" title="Volver al CRM">
          <i data-lucide="arrow-left" class="h-4 w-4"></i>
        </a>
        <div>
          <div class="flex items-center gap-2">
            <span class="text-lg font-extrabold text-slate-900">Cuentas MAZA</span>
            <span id="badge-proyecto" class="rounded-full px-2.5 py-0.5 text-[11px] font-bold"></span>
          </div>
          <p class="text-xs text-slate-500">Planes, soporte y errores. Cada cambio queda en la auditoría.</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="sincronizar()" class="inline-flex items-center gap-1.5 rounded-xl border border-slate-300 bg-white px-3 py-2 text-xs font-bold hover:bg-slate-50" title="Pasa la etapa del embudo de cada taller vinculado a su plan real">
          <i data-lucide="refresh-ccw" class="h-4 w-4"></i><span class="hidden md:inline">Sincronizar embudo</span>
        </button>
        <button onclick="abrirCrear()" class="inline-flex items-center gap-1.5 rounded-xl bg-amber-500 hover:bg-amber-600 px-3 py-2 text-xs font-extrabold text-white">
          <i data-lucide="user-plus" class="h-4 w-4"></i><span>Crear cuenta</span>
        </button>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-4 py-5 space-y-5">
    <!-- Métricas -->
    <section id="metricas" class="grid grid-cols-2 md:grid-cols-5 gap-3"></section>

    <!-- Pestañas -->
    <nav class="flex gap-1 border-b border-slate-200 text-sm font-bold">
      <button data-tab="hoy" class="tab px-3 py-2">Hoy <span id="n-hoy" class="text-red-600"></span></button>
      <button data-tab="cuentas" class="tab px-3 py-2">Cuentas</button>
      <button data-tab="tickets" class="tab px-3 py-2">Soporte <span id="n-tickets" class="text-amber-600"></span></button>
      <button data-tab="errores" class="tab px-3 py-2">Errores <span id="n-errores" class="text-red-600"></span></button>
      <button data-tab="cobros" class="tab px-3 py-2">Cobros</button>
      <button data-tab="metricas" class="tab px-3 py-2">Métricas</button>
      <button data-tab="ia" class="tab px-3 py-2">Consumo IA</button>
      <button data-tab="auditoria" class="tab px-3 py-2">Auditoría</button>
    </nav>

    <!-- Cuentas -->
    <section id="tab-cuentas" class="space-y-3">
      <div class="flex flex-wrap gap-2">
        <input id="buscar" placeholder="Buscar por taller, correo o ciudad" class="flex-1 min-w-[220px] rounded-xl border border-slate-300 px-3 py-2 text-sm">
        <select id="filtro-modo" class="rounded-xl border border-slate-300 px-3 py-2 text-sm">
          <option value="">Todos los planes</option>
          <option value="trial">Prueba</option>
          <option value="trial_expirado">Prueba vencida</option>
          <option value="pro">Taller Solo</option>
          <option value="ilimitado">Taller Pro</option>
          <option value="empresa">Empresa</option>
          <option value="basico">Básico (legado)</option>
        </select>
        <select id="orden" class="rounded-xl border border-slate-300 px-3 py-2 text-sm">
          <option value="creadoEn">Más recientes</option>
          <option value="vence">Vencen antes</option>
          <option value="nombre">Nombre</option>
        </select>
      </div>
      <div class="overflow-x-auto rounded-2xl border border-slate-200 bg-white">
        <table class="w-full text-sm">
          <thead class="bg-slate-50 text-left text-xs uppercase tracking-wide text-slate-500">
            <tr><th class="px-3 py-2">Taller</th><th class="px-3 py-2">Plan</th><th class="px-3 py-2">Vence / uso</th><th class="px-3 py-2">CRM</th><th class="px-3 py-2">Alta</th></tr>
          </thead>
          <tbody id="filas"></tbody>
        </table>
      </div>
    </section>

    <section id="tab-tickets" class="hidden space-y-2"></section>
    <section id="tab-errores" class="hidden space-y-2"></section>
    <section id="tab-auditoria" class="hidden"></section>
    <section id="tab-hoy" class="hidden space-y-2"></section>
    <section id="tab-cobros" class="hidden space-y-3"></section>
    <section id="tab-metricas" class="hidden space-y-4"></section>
    <section id="tab-ia" class="hidden space-y-4"></section>
  </main>

  <!-- Panel de detalle -->
  <div id="panel" class="hidden fixed inset-0 z-40">
    <div class="absolute inset-0 bg-slate-900/40" onclick="cerrarPanel()"></div>
    <aside class="absolute right-0 top-0 h-full w-full max-w-xl overflow-y-auto bg-white shadow-2xl p-5 space-y-5" id="panel-cuerpo"></aside>
  </div>

  <!-- Crear cuenta -->
  <div id="modal-crear" class="hidden fixed inset-0 z-40 grid place-items-center">
    <div class="absolute inset-0 bg-slate-900/40" onclick="cerrarCrear()"></div>
    <form onsubmit="crearCuenta(event)" class="relative w-full max-w-md rounded-2xl bg-white p-5 space-y-3 shadow-2xl mx-4">
      <h2 class="text-lg font-extrabold">Crear cuenta</h2>
      <p class="text-xs text-slate-500">Para un taller que pagó por fuera o una cuenta de prueba. La contraseña se la entregas tú.</p>
      <label class="block text-xs font-bold">Correo<input name="email" type="email" required class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-sm font-normal"></label>
      <label class="block text-xs font-bold">Contraseña (mín. 8)
        <div class="mt-1 flex gap-2">
          <input name="password" required minlength="8" class="flex-1 rounded-xl border border-slate-300 px-3 py-2 text-sm font-normal font-mono">
          <button type="button" onclick="this.previousElementSibling.value=generarClave()" class="rounded-xl border border-slate-300 px-3 text-xs">Generar</button>
        </div>
      </label>
      <label class="block text-xs font-bold">Nombre del taller<input name="nombreTaller" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-sm font-normal"></label>
      <label class="block text-xs font-bold">Plan inicial
        <select name="plan" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-sm font-normal">
          <option value="trial">Prueba (14 días de uso)</option>
          <option value="pro">Taller Solo</option>
          <option value="ilimitado">Taller Pro</option>
          <option value="empresa">Empresa</option>
        </select>
      </label>
      <label class="block text-xs font-bold">Vincular a un taller del CRM (opcional)
        <select name="tallerCrmId" class="selector-crm mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-sm font-normal"></select>
      </label>
      <p class="text-[11px] text-slate-500">Un plan pagado se crea sin vencimiento: ajústalo después en la ficha.</p>
      <div class="flex justify-end gap-2 pt-1">
        <button type="button" onclick="cerrarCrear()" class="rounded-xl border border-slate-300 px-4 py-2 text-sm font-bold">Cancelar</button>
        <button class="rounded-xl bg-amber-500 hover:bg-amber-600 px-4 py-2 text-sm font-extrabold text-white">Crear</button>
      </div>
    </form>
  </div>

  <div id="toast" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 z-50 rounded-xl px-4 py-2 text-sm font-bold text-white shadow-lg"></div>

<script>
const NOMBRE = { trial: 'Prueba', trial_expirado: 'Prueba vencida', pro: 'Taller Solo', ilimitado: 'Taller Pro', empresa: 'Empresa', basico: 'Básico (legado)' };
const COLOR = {
  trial: 'bg-sky-50 text-sky-700 border-sky-200',
  trial_expirado: 'bg-red-50 text-red-700 border-red-200',
  pro: 'bg-emerald-50 text-emerald-700 border-emerald-200',
  ilimitado: 'bg-emerald-50 text-emerald-800 border-emerald-300',
  empresa: 'bg-violet-50 text-violet-700 border-violet-200',
  basico: 'bg-slate-100 text-slate-600 border-slate-200',
};
let cuentas = [];
let talleresCrm = [];
let pestana = 'cuentas';

const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fecha = (iso) => iso ? new Date(iso).toLocaleDateString('es-CL', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';
const fechaHora = (iso) => iso ? new Date(iso).toLocaleString('es-CL', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '—';
const plata = (n) => '$' + Number(n || 0).toLocaleString('es-CL');
const iconos = () => window.lucide && lucide.createIcons();

function toast(msg, ok = true) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = `fixed bottom-5 left-1/2 -translate-x-1/2 z-50 rounded-xl px-4 py-2 text-sm font-bold text-white shadow-lg ${ok ? 'bg-emerald-600' : 'bg-red-600'}`;
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.add('hidden'), ok ? 2500 : 6000);
}

async function api(url, opts = {}) {
  const res = await fetch(url, { ...opts, headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) } });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || `Error ${res.status}`);
  return data;
}

function generarClave() {
  const a = crypto.getRandomValues(new Uint8Array(9));
  return 'Maza-' + btoa(String.fromCharCode(...a)).replace(/[+/=]/g, '').slice(0, 10);
}

// ─── Carga ───────────────────────────────────────────────────────────────────
async function cargar() {
  try {
    const est = await api('/api/maza/estado');
    const b = $('#badge-proyecto');
    b.textContent = est.emulador ? 'EMULADOR' : 'PRODUCCIÓN';
    b.className = `rounded-full px-2.5 py-0.5 text-[11px] font-bold border ${est.emulador ? 'bg-sky-50 text-sky-700 border-sky-200' : 'bg-red-50 text-red-700 border-red-200'}`;

    const [datos, crm] = await Promise.all([api('/api/maza/cuentas'), api('/api/talleres')]);
    cuentas = datos.cuentas;
    talleresCrm = crm;
    pintarMetricas(datos.metricas);
    pintarCuentas();
    llenarSelectoresCrm();
  } catch (e) {
    $('#filas').innerHTML = `<tr><td colspan="5" class="px-3 py-6 text-center text-red-600">${esc(e.message)}</td></tr>`;
  }
  api('/api/maza/tickets').then((t) => { const n = t.filter((x) => x.estado === 'abierto').length; $('#n-tickets').textContent = n ? `(${n})` : ''; }).catch(() => {});
  api('/api/maza/errores').then((e) => { $('#n-errores').textContent = e.length ? `(${e.length})` : ''; }).catch(() => {});
}

function pintarMetricas(m) {
  const tarjeta = (t, v, sub = '') => `<div class="rounded-2xl border border-slate-200 bg-white p-3"><p class="text-[11px] font-bold uppercase text-slate-500">${t}</p><p class="text-2xl font-extrabold">${v}</p><p class="text-[11px] text-slate-500">${sub}</p></div>`;
  const pm = m.porModo || {};
  $('#metricas').innerHTML =
    tarjeta('Talleres', m.talleres, `${m.miembros} ${m.miembros === 1 ? 'miembro' : 'miembros'} de equipo`) +
    tarjeta('Pagando', m.pagando, `Solo ${pm.pro || 0} · Pro ${pm.ilimitado || 0} · Empresa ${pm.empresa || 0}`) +
    tarjeta('En prueba', pm.trial || 0) +
    tarjeta('Prueba vencida', pm.trial_expirado || 0, 'para recuperar') +
    tarjeta('Fundadores', m.fundadores, 'de 20');
}

function textoUso(c) {
  if (['pro', 'ilimitado', 'empresa'].includes(c.plan)) {
    if (!c.planVigenteHasta) return 'Sin vencimiento';
    const dias = Math.ceil((new Date(c.planVigenteHasta) - Date.now()) / 864e5);
    return dias >= 0 ? `${fecha(c.planVigenteHasta)} · ${dias} d` : `Venció ${fecha(c.planVigenteHasta)}`;
  }
  if (c.plan === 'basico') return '—';
  return `${c.trialDiasUsados}/14 días · ${c.trialOrdenes}/30 órdenes`;
}

function pintarCuentas() {
  const q = $('#buscar').value.trim().toLowerCase();
  const modo = $('#filtro-modo').value;
  const orden = $('#orden').value;
  let lista = cuentas.filter((c) =>
    (!modo || c.modo === modo) &&
    (!q || [c.nombreTaller, c.email, c.ciudad].some((v) => (v || '').toLowerCase().includes(q))));
  if (orden === 'nombre') lista.sort((a, b) => (a.nombreTaller || a.email).localeCompare(b.nombreTaller || b.email));
  if (orden === 'vence') lista.sort((a, b) => (a.planVigenteHasta || '9999').localeCompare(b.planVigenteHasta || '9999'));

  $('#filas').innerHTML = lista.map((c) => `
    <tr class="border-t border-slate-100 hover:bg-amber-50/40 cursor-pointer" onclick="abrirCuenta('${esc(c.uid)}')">
      <td class="px-3 py-2"><p class="font-bold">${esc(c.nombreTaller || '(sin nombre)')} ${c.esFundador ? `<span class="text-[10px] text-amber-700">★ ${c.numeroFundador}</span>` : ''}</p><p class="text-xs text-slate-500">${esc(c.email)}${c.ciudad ? ' · ' + esc(c.ciudad) : ''}</p></td>
      <td class="px-3 py-2"><span class="rounded-full border px-2 py-0.5 text-xs font-bold ${COLOR[c.modo] || ''}">${esc(NOMBRE[c.modo] || c.modo)}</span></td>
      <td class="px-3 py-2 text-xs">${esc(textoUso(c))}</td>
      <td class="px-3 py-2 text-xs">${c.crm ? `<span class="text-emerald-700 font-semibold">${esc(c.crm.nombre)}</span>` : '<span class="text-slate-400">—</span>'}</td>
      <td class="px-3 py-2 text-xs text-slate-500">${fecha(c.creadoEn)}</td>
    </tr>`).join('') || '<tr><td colspan="5" class="px-3 py-6 text-center text-slate-500">Sin resultados</td></tr>';
}

function llenarSelectoresCrm(seleccion = '') {
  const vinculados = new Set(cuentas.filter((c) => c.crm).map((c) => c.crm.id));
  const opciones = '<option value="">— Ninguno —</option>' + talleresCrm
    .filter((t) => !vinculados.has(t.id) || String(t.id) === String(seleccion))
    .map((t) => `<option value="${t.id}" ${String(t.id) === String(seleccion) ? 'selected' : ''}>${esc(t.nombre)} · ${esc(t.comuna)} (${esc(t.estado)})</option>`).join('');
  document.querySelectorAll('.selector-crm').forEach((s) => { s.innerHTML = opciones; });
}

// ─── Ficha de la cuenta ──────────────────────────────────────────────────────
async function abrirCuenta(uid) {
  $('#panel').classList.remove('hidden');
  $('#panel-cuerpo').innerHTML = '<p class="text-sm text-slate-500">Cargando…</p>';
  try {
    const d = await api(`/api/maza/cuentas/${encodeURIComponent(uid)}`);
    pintarFicha(d);
  } catch (e) {
    $('#panel-cuerpo').innerHTML = `<p class="text-sm text-red-600">${esc(e.message)}</p>`;
  }
}

function pintarFicha(d) {
  const c = d.cuenta, r = d.resumen;
  const vig = c.planVigenteHasta ? c.planVigenteHasta.slice(0, 10) : '';
  $('#panel-cuerpo').innerHTML = `
    <div class="flex items-start justify-between gap-3">
      <div>
        <h2 class="text-xl font-extrabold">${esc(c.nombreTaller || '(sin nombre)')}</h2>
        <p class="text-sm text-slate-500">${esc(c.email)} <button onclick="navigator.clipboard.writeText('${esc(c.email)}');toast('Correo copiado')" class="text-amber-700 text-xs font-bold">copiar</button></p>
        <p class="text-xs text-slate-500">${esc([c.tipoTaller, c.ciudad, c.pais, c.telefono].filter(Boolean).join(' · '))}</p>
        <p class="text-xs text-slate-400 font-mono">${esc(c.uid)}</p>
      </div>
      <button onclick="cerrarPanel()" class="p-2 rounded-xl hover:bg-slate-100"><i data-lucide="x" class="h-5 w-5"></i></button>
    </div>

    <section class="grid grid-cols-2 gap-2 text-sm">
      <div class="rounded-xl bg-slate-50 p-3"><p class="text-[11px] font-bold uppercase text-slate-500">Ahora</p><span class="rounded-full border px-2 py-0.5 text-xs font-bold ${COLOR[c.modo] || ''}">${esc(NOMBRE[c.modo])}</span><p class="text-xs mt-1">${esc(textoUso(c))}</p></div>
      <div class="rounded-xl bg-slate-50 p-3"><p class="text-[11px] font-bold uppercase text-slate-500">Último acceso</p><p class="font-bold">${fechaHora(d.ultimoAcceso)}</p><p class="text-xs text-slate-500">Alta ${fecha(c.creadoEn)}</p></div>
      <div class="rounded-xl bg-slate-50 p-3"><p class="text-[11px] font-bold uppercase text-slate-500">Uso</p><p class="text-xs">${r.clientes} clientes · ${r.ordenesTotal} órdenes (${r.ordenesAbiertas} abiertas) · ${r.inventario} repuestos</p></div>
      <div class="rounded-xl bg-slate-50 p-3"><p class="text-[11px] font-bold uppercase text-slate-500">Equipo</p><p class="text-xs">${d.equipo.length ? d.equipo.map((e) => `${esc(e.nombre || e.email)} (${esc(e.rol)}${e.activo === false ? ', inactivo' : ''})`).join('<br>') : 'Solo el dueño'}</p></div>
    </section>

    <form id="form-plan" onsubmit="guardarPlan(event, '${esc(c.uid)}')" class="space-y-3 rounded-2xl border border-slate-200 p-4">
      <h3 class="font-extrabold">Plan y facturación</h3>
      <label class="block text-xs font-bold">Plan
        <select name="plan" onchange="document.getElementById('fila-asientos').classList.toggle('hidden', this.value!=='empresa')" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-sm font-normal">
          ${['trial', 'pro', 'ilimitado', 'empresa', 'basico'].map((p) => `<option value="${p}" ${c.plan === p ? 'selected' : ''}>${NOMBRE[p]}</option>`).join('')}
        </select>
      </label>
      <label id="fila-asientos" class="block text-xs font-bold ${c.plan === 'empresa' ? '' : 'hidden'}">Asientos (dueño incluido, mínimo 3)
        <input name="asientosContratados" type="number" min="3" max="50" value="${c.asientosContratados || 3}" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-sm font-normal">
      </label>
      <label class="block text-xs font-bold">Pagado hasta (vacío = sin vencimiento)
        <input name="planVigenteHasta" type="date" value="${vig}" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-sm font-normal">
      </label>
      <div class="flex flex-wrap gap-1 text-xs">
        ${[30, 90, 365].map((n) => `<button type="button" onclick="sumarDias(${n})" class="rounded-lg border border-slate-300 px-2 py-1">+${n === 365 ? '1 año' : n + ' días'}</button>`).join('')}
        <button type="button" onclick="document.querySelector('#form-plan [name=planVigenteHasta]').value=''" class="rounded-lg border border-slate-300 px-2 py-1">Sin límite</button>
      </div>
      <label class="flex items-center gap-2 text-sm"><input name="esFundador" type="checkbox" ${c.esFundador ? 'checked' : ''} onchange="document.getElementById('fila-fundador').classList.toggle('hidden', !this.checked)"> Es fundador</label>
      <div id="fila-fundador" class="grid grid-cols-2 gap-2 ${c.esFundador ? '' : 'hidden'}">
        <label class="text-xs font-bold">N° (1–20)<input name="numeroFundador" type="number" min="1" max="20" value="${c.numeroFundador || ''}" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-sm font-normal"></label>
        <label class="text-xs font-bold">Descuento (0,5 = 50 %)<input name="descuentoFundador" type="number" step="0.05" min="0" max="1" value="${c.descuentoFundador ?? 0.5}" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-sm font-normal"></label>
      </div>
      <label class="flex items-center gap-2 text-sm"><input name="mpConnectHabilitado" type="checkbox" ${c.mpConnectHabilitado ? 'checked' : ''}> Cobro online con Mercado Pago Connect (piloto)</label>
      <button class="w-full rounded-xl bg-slate-900 hover:bg-slate-800 py-2 text-sm font-extrabold text-white">Guardar plan</button>
    </form>

    <form onsubmit="registrarPago(event, '${esc(c.uid)}')" class="space-y-2 rounded-2xl border border-slate-200 p-4">
      <h3 class="font-extrabold">Registrar pago</h3>
      <div class="grid grid-cols-3 gap-2">
        <input name="monto" type="number" min="1" required placeholder="Monto" class="rounded-xl border border-slate-300 px-3 py-2 text-sm">
        <select name="meses" class="rounded-xl border border-slate-300 px-3 py-2 text-sm">${[1, 3, 6, 12].map((m) => `<option value="${m}">${m} ${m === 1 ? 'mes' : 'meses'}</option>`).join('')}</select>

const SALUD = { vencido: ['Prueba vencida', 'bg-red-50 text-red-700 border-red-200'], riesgo: ['En riesgo', 'bg-red-50 text-red-700 border-red-200'], renovar: ['Renovar', 'bg-amber-50 text-amber-700 border-amber-200'], tibio: ['Tibio', 'bg-amber-50 text-amber-700 border-amber-200'], sano: ['Sano', 'bg-emerald-50 text-emerald-700 border-emerald-200'] };
const saludo = (c) => `Hola${c.nombreTaller ? ' ' + c.nombreTaller : ''}, soy Rafa de MAZA.`;
const MENSAJE = {
  vencido: (c) => `${saludo(c)} Tu prueba terminó: ¿te ayudo a dejar el plan activo para que no pierdas tus órdenes?`,
  riesgo: (c) => `${saludo(c)} Vi que no has entrado estos días, ¿te trabaste en algo? Te ayudo en 5 minutos a dejar tu primera orden lista.`,
  renovar: (c) => `${saludo(c)} Tu plan vence el ${fecha(c.planVigenteHasta)}; te dejo los datos para renovar y seguir sin cortes.`,
  tibio: (c) => `${saludo(c)} ¿Probaste mandar un presupuesto por link? Al cliente le llega por WhatsApp y lo aprueba desde el celular.`,
};
function linkWa(tel, texto) {
  const n = String(tel || '').replace(/\D/g, '');
  return n ? `<a href="https://wa.me/${n}?text=${encodeURIComponent(texto)}" target="_blank" rel="noopener" class="inline-flex items-center gap-1 rounded-lg bg-emerald-600 px-2 py-1 text-xs font-bold text-white">WhatsApp</a>` : '<span class="text-xs text-slate-400">sin teléfono</span>';
}
const insignia = (s) => `<span class="rounded-full border px-2 py-0.5 text-xs font-bold ${SALUD[s]?.[1] || ''}">${SALUD[s]?.[0] || s}</span>`;
const PASOS = { cuenta_creada: 'Cuenta', primer_vehiculo: '1ª orden', usuarios_invitados: 'Equipo', primer_presupuesto: 'Link aprobado' };

async function registrarPago(ev, uid) {
  ev.preventDefault();
  const f = Object.fromEntries(new FormData(ev.target).entries());
  if (!confirm(`¿Registrar ${plata(f.monto)} por ${f.meses} mes(es)?`)) return;
  try {
    const r = await api(`/api/maza/cuentas/${encodeURIComponent(uid)}/pago`, { method: 'POST', body: JSON.stringify({ ...f, monto: Number(f.monto), meses: Number(f.meses) }) });
    toast(`Pago registrado. Vigente hasta ${fecha(r.vigenteHasta)}.`);
    await cargar();
    abrirCuenta(uid);
  } catch (e) { toast(e.message, false); }
}

// ─── Consumo de IA ───────────────────────────────────────────────────────────
// Lo que escribe el Worker en usoIA (maza_admin.consumo_ia). Unidades = cupo
// gastado; los tokens son lo que se paga. Gemini sin precio cargado: se
// muestran sus tokens pero no su costo.
let diasIA = 30;
const num = (n) => Number(n || 0).toLocaleString('es-CL');
const usd = (n) => n == null ? '—' : 'US$ ' + Number(n).toLocaleString('es-CL', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
const tokens = (t) => `<span title="Gemini entrada/salida · Haiku entrada/salida">G ${num(t.geminiEntrada)}/${num(t.geminiSalida)} · H ${num(t.haikuEntrada)}/${num(t.haikuSalida)}</span>`;

async function cargarIA(dias = diasIA) {
  diasIA = dias;
  const el = $('#tab-ia');
  el.innerHTML = '<p class="text-sm text-slate-500">Leyendo usoIA…</p>';
  try {
    const r = await api(`/api/maza/consumo-ia?dias=${dias}`);
    const t = r.totales;
    const tarjeta = (titulo, v, sub = '') => `<div class="rounded-2xl border border-slate-200 bg-white p-3"><p class="text-[11px] font-bold uppercase text-slate-500">${titulo}</p><p class="text-2xl font-extrabold">${v}</p><p class="text-[11px] text-slate-500">${sub}</p></div>`;
    const periodo = [7, 30, 90].map((d) => `<button onclick="cargarIA(${d})" class="rounded-xl border px-3 py-1.5 text-xs font-bold ${d === dias ? 'border-amber-500 bg-amber-50 text-amber-800' : 'border-slate-300 bg-white text-slate-600'}">${d} días</button>`).join('');
    const max = Math.max(1, ...r.porDia.map((x) => x.unidades));
    const barras = r.porDia.map((x) => `<div class="flex items-center gap-2 text-xs py-0.5"><span class="w-20 font-mono">${x.fecha.slice(5)}</span><div class="flex-1 h-2 rounded bg-slate-100"><div class="h-2 rounded bg-amber-500" style="width:${x.unidades / max * 100}%"></div></div><span class="w-10 text-right">${x.unidades}</span></div>`).join('');
    const filaFuncion = (f) => `<tr class="border-t border-slate-100"><td class="px-3 py-2 font-bold">${esc(f.nombre)}</td><td class="px-3 py-2 text-right">${num(f.unidades)}</td><td class="px-3 py-2 text-right">${num(f.gemini)} / ${num(f.haiku)}</td><td class="px-3 py-2 text-right">${num(f.devueltas)}</td><td class="px-3 py-2 text-right font-mono text-[11px] whitespace-nowrap">${tokens(f)}</td><td class="px-3 py-2 text-right">${usd(f.haikuUsd)}</td></tr>`;
    const tope = (n) => n ? `<span class="rounded-full bg-red-50 border border-red-200 px-2 text-red-700 font-bold">${n}</span>` : '<span class="text-slate-400">0</span>';
    const filaTaller = (x, i) => `<tr class="border-t border-slate-100 cursor-pointer hover:bg-slate-50" onclick="document.getElementById('ia-p-${i}').classList.toggle('hidden')">
        <td class="px-3 py-2"><span class="font-bold">${esc(x.nombreTaller)}</span> <span class="rounded-full border px-2 text-[10px] font-bold ${COLOR[x.modo] || ''}">${esc(NOMBRE[x.modo] || x.modo)}</span></td>
        <td class="px-3 py-2 text-right">${num(x.consultas)}</td><td class="px-3 py-2 text-right">${num(x.documentos)}</td><td class="px-3 py-2 text-right">${num(x.busquedas)}</td>
        <td class="px-3 py-2 text-right">${x.dias}</td><td class="px-3 py-2 text-right">${tope(x.diasTopeChat)} / ${tope(x.diasTopeDocumentos)}</td>
        <td class="px-3 py-2 text-right font-mono text-[11px] whitespace-nowrap">${tokens(x.totales)}</td><td class="px-3 py-2 text-right font-bold">${usd(x.haikuUsd)}</td></tr>
      <tr id="ia-p-${i}" class="hidden bg-slate-50"><td colspan="8" class="px-6 py-2">${x.personas.map((p) => `<div class="flex flex-wrap gap-x-3 text-xs py-0.5"><span class="font-bold w-56 truncate">${esc(p.email || p.uid)}${p.esDueno ? ' · dueño' : ''}</span>${Object.entries(p.funciones).map(([k, v]) => `<span>${esc(r.nombresFuncion?.[k] || k)}: <b>${num(v.unidades)}</b></span>`).join('')}</div>`).join('')}</td></tr>`;
    const tabla = (cabeza, cuerpo, vacio, cols) => `<div class="overflow-x-auto rounded-2xl border border-slate-200 bg-white"><table class="w-full text-xs"><thead class="bg-slate-50 text-slate-500"><tr>${cabeza}</tr></thead><tbody>${cuerpo || `<tr><td colspan="${cols}" class="px-3 py-6 text-center text-slate-500">${vacio}</td></tr>`}</tbody></table></div>`;
    const th = (t, der = true) => `<th class="px-3 py-2 ${der ? 'text-right' : 'text-left'} font-bold">${t}</th>`;
    el.innerHTML = `<div class="flex flex-wrap items-center justify-between gap-2"><p class="text-xs text-slate-500">Desde ${fecha(r.desde)} (UTC). Unidades = cupo gastado; el costo es lo que se paga por tokens.</p><div class="flex gap-2">${periodo}</div></div>
      <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
        ${tarjeta('Consultas', num(t.consultas), 'asistente, chat y avisos')}
        ${tarjeta('Documentos', num(t.documentos), 'facturas y listas')}
        ${tarjeta('Búsquedas', num(t.busquedas), `${num(t.embebidos)} textos embebidos`)}
        ${tarjeta('Costo Haiku', usd(t.haikuUsd), `${num(t.haiku)} respuestas de respaldo`)}
        ${tarjeta('Tokens Gemini', num(t.geminiEntrada + t.geminiSalida), r.precioGeminiCargado ? usd(t.geminiUsd) : 'sin precio cargado')}
      </div>
      <div class="rounded-2xl border border-slate-200 bg-white p-3"><h3 class="font-extrabold text-sm mb-2">Consultas y documentos por día</h3>${barras || '<p class="text-xs text-slate-500">Sin uso en el período. ¿Ya está desplegado el Worker con la medición?</p>'}</div>
      <h3 class="font-extrabold pt-1">Por función</h3>
      ${tabla(th('Función', false) + th('Unidades') + th('Gemini / Haiku') + th('Devueltas') + th('Tokens') + th('USD Haiku'), r.funciones.map(filaFuncion).join(''), 'Sin datos.', 6)}
      <h3 class="font-extrabold pt-1">Por cuenta <span class="text-xs font-normal text-slate-500">· clic para ver a cada persona · "al tope" = días en que alguien agotó el chat / el taller agotó los documentos</span></h3>
      ${tabla(th('Taller', false) + th('Consultas') + th('Docs') + th('Búsq.') + th('Días con uso') + th('Al tope chat / docs') + th('Tokens') + th('USD Haiku'), r.talleres.map(filaTaller).join(''), 'Ninguna cuenta usó IA en el período.', 8)}`;
  } catch (e) { el.innerHTML = `<p class="text-sm text-red-600">${esc(e.message)}</p>`; }
}

function sumarDias(n) {
  const input = document.querySelector('#form-plan [name=planVigenteHasta]');
  const d = new Date();
  d.setDate(d.getDate() + n);
  input.value = d.toISOString().slice(0, 10);
}

async function guardarPlan(ev, uid) {
  ev.preventDefault();
  const f = new FormData(ev.target);
  const cuerpo = {
    plan: f.get('plan'),
    planVigenteHasta: f.get('planVigenteHasta') || null,
    asientosContratados: f.get('plan') === 'empresa' ? Number(f.get('asientosContratados')) : null,
    esFundador: f.get('esFundador') === 'on',
    numeroFundador: f.get('numeroFundador') ? Number(f.get('numeroFundador')) : null,
    descuentoFundador: f.get('descuentoFundador') ? Number(f.get('descuentoFundador')) : null,
    mpConnectHabilitado: f.get('mpConnectHabilitado') === 'on',
  };
  const c = cuentas.find((x) => x.uid === uid);
  const resumen = `${NOMBRE[cuerpo.plan]}${cuerpo.planVigenteHasta ? ' hasta ' + cuerpo.planVigenteHasta : ' sin vencimiento'}`;
  if (!confirm(`¿Cambiar el plan de ${c?.nombreTaller || c?.email} a ${resumen}?`)) return;
  try {
    const r = await api(`/api/maza/cuentas/${encodeURIComponent(uid)}/plan`, { method: 'POST', body: JSON.stringify(cuerpo) });
    toast(r.cambio ? `Plan actualizado${r.miembrosEspejados ? ` (y ${r.miembrosEspejados} del equipo)` : ''}.` : 'Sin cambios.');
    await cargar();
    abrirCuenta(uid);
  } catch (e) { toast(e.message, false); }
}

async function vincular(uid) {
  const id = $('#vinculo-crm').value;
  const actual = cuentas.find((x) => x.uid === uid)?.crm;
  try {
    if (!id && actual) await api('/api/maza/vincular', { method: 'POST', body: JSON.stringify({ tallerCrmId: actual.id, uid: null }) });
    if (id) {
      if (actual && String(actual.id) !== id) await api('/api/maza/vincular', { method: 'POST', body: JSON.stringify({ tallerCrmId: actual.id, uid: null }) });
      await api('/api/maza/vincular', { method: 'POST', body: JSON.stringify({ tallerCrmId: Number(id), uid }) });
    }
    toast('Vínculo guardado.');
    await cargar();
    abrirCuenta(uid);
  } catch (e) { toast(e.message, false); }
}

async function cambiarClave(uid) {
  const password = $('#nueva-clave').value;
  if (password.length < 8) return toast('Mínimo 8 caracteres.', false);
  if (!confirm('¿Cambiar la contraseña? La actual deja de funcionar.')) return;
  try {
    await api(`/api/maza/cuentas/${encodeURIComponent(uid)}/password`, { method: 'POST', body: JSON.stringify({ password }) });
    await navigator.clipboard.writeText(password).catch(() => {});
    toast('Contraseña cambiada (copiada al portapapeles).');
  } catch (e) { toast(e.message, false); }
}

function cerrarPanel() { $('#panel').classList.add('hidden'); }

// ─── Crear cuenta ────────────────────────────────────────────────────────────
function abrirCrear() {
  llenarSelectoresCrm();
  const f = document.querySelector('#modal-crear form');
  f.reset();
  f.password.value = generarClave();
  $('#modal-crear').classList.remove('hidden');
}
function cerrarCrear() { $('#modal-crear').classList.add('hidden'); }

async function crearCuenta(ev) {
  ev.preventDefault();
  const f = new FormData(ev.target);
  const cuerpo = Object.fromEntries(f.entries());
  cuerpo.tallerCrmId = cuerpo.tallerCrmId ? Number(cuerpo.tallerCrmId) : null;
  try {
    const r = await api('/api/maza/cuentas', { method: 'POST', body: JSON.stringify(cuerpo) });
    await navigator.clipboard.writeText(`${cuerpo.email} / ${cuerpo.password}`).catch(() => {});
    toast('Cuenta creada (correo y contraseña copiados).');
    cerrarCrear();
    await cargar();
    abrirCuenta(r.uid);
  } catch (e) { toast(e.message, false); }
}

async function sincronizar() {
  try {
    const r = await api('/api/maza/sincronizar', { method: 'POST' });
    toast(r.cambios ? `${r.cambios} taller(es) cambiaron de etapa.` : 'El embudo ya estaba al día.');
    cargar();
  } catch (e) { toast(e.message, false); }
}

// ─── Soporte, errores, auditoría ─────────────────────────────────────────────
async function cargarTickets() {
  const el = $('#tab-tickets');
  el.innerHTML = '<p class="text-sm text-slate-500">Cargando…</p>';
  try {
    const t = await api('/api/maza/tickets');
    el.innerHTML = t.map((x) => `
      <article class="rounded-2xl border ${x.estado === 'abierto' ? 'border-amber-300 bg-amber-50/40' : 'border-slate-200 bg-white'} p-4 space-y-2">
        <div class="flex justify-between gap-2"><p class="font-bold">${esc(x.asunto)}</p><span class="text-xs text-slate-500">${fechaHora(x.fecha)}</span></div>
        <p class="text-xs text-slate-500">${esc(x.nombreTaller)} · ${esc(x.email)}</p>
        <p class="text-sm whitespace-pre-wrap">${esc(x.descripcion)}</p>
        ${x.estado === 'abierto' ? `
          <textarea id="resp-${esc(x.id)}" rows="2" placeholder="Respuesta (opcional, la ve el taller)" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm"></textarea>
          <button onclick="resolverTicket('${esc(x.id)}')" class="rounded-xl bg-slate-900 px-3 py-1.5 text-xs font-bold text-white">Marcar resuelto</button>`
        : `<p class="text-xs text-emerald-700">Resuelto${x.respuesta ? ': ' + esc(x.respuesta) : ''} ${linkWa(cuentas.find((c) => c.uid === x.uid)?.telefono, `Hola, te escribo de MAZA por tu reporte «${x.asunto}»: ${x.respuesta || 'ya quedó resuelto'}.`)}</p>`}
      </article>`).join('') || '<p class="text-sm text-slate-500">Sin tickets.</p>';
  } catch (e) { el.innerHTML = `<p class="text-sm text-red-600">${esc(e.message)}</p>`; }
}

async function resolverTicket(id) {
  try {
    await api(`/api/maza/tickets/${encodeURIComponent(id)}/resolver`, { method: 'POST', body: JSON.stringify({ respuesta: document.getElementById('resp-' + id).value }) });
    toast('Ticket resuelto.');
    cargarTickets();
    cargar();
  } catch (e) { toast(e.message, false); }
}

async function cargarErrores() {
  const el = $('#tab-errores');
  el.innerHTML = '<p class="text-sm text-slate-500">Cargando…</p>';
  try {
    const errs = await api('/api/maza/errores');
    el.innerHTML = errs.map((x) => `
      <details class="rounded-2xl border border-slate-200 bg-white p-3">
        <summary class="cursor-pointer text-sm"><span class="font-bold">${esc(x.mensaje)}</span><span class="block text-xs text-slate-500">${fechaHora(x.fecha)} · ${esc(x.nombreTaller || x.email || 'anónimo')} · ${esc(x.ruta)} · v${esc(x.appVersion)}</span></summary>
        <pre class="mt-2 overflow-x-auto text-[11px] font-mono text-slate-600">${esc(x.stack)}</pre>
        <button onclick="borrarError('${esc(x.id)}')" class="mt-2 rounded-lg border border-slate-300 px-2 py-1 text-xs">Marcar visto (borrar)</button>
      </details>`).join('') || '<p class="text-sm text-slate-500">Sin errores registrados.</p>';
  } catch (e) { el.innerHTML = `<p class="text-sm text-red-600">${esc(e.message)}</p>`; }
}

async function borrarError(id) {
  try {
    await api(`/api/maza/errores/${encodeURIComponent(id)}`, { method: 'DELETE' });
    cargarErrores();
    cargar();
  } catch (e) { toast(e.message, false); }
}

async function cargarAuditoria() {
  const el = $('#tab-auditoria');
  el.innerHTML = '<p class="text-sm text-slate-500">Cargando…</p>';
  try {
    const filas = await api('/api/maza/auditoria');
    const cuentaDe = (uid) => cuentas.find((c) => c.uid === uid);
    const cambio = (a) => {
      if (!a.despues) return '';
      const antes = a.antes || {};
      return Object.keys(a.despues).filter((k) => JSON.stringify(antes[k]) !== JSON.stringify(a.despues[k]))
        .map((k) => a.antes ? `${k}: ${esc(JSON.stringify(antes[k]))} → ${esc(JSON.stringify(a.despues[k]))}` : `${k}: ${esc(JSON.stringify(a.despues[k]))}`).join('<br>');
    };
    el.innerHTML = `<div class="overflow-x-auto rounded-2xl border border-slate-200 bg-white"><table class="w-full text-xs">
      <thead class="bg-slate-50 text-left uppercase text-slate-500"><tr><th class="px-3 py-2">Fecha</th><th class="px-3 py-2">Acción</th><th class="px-3 py-2">Cuenta</th><th class="px-3 py-2">Cambio</th><th class="px-3 py-2">Quién</th></tr></thead>
      <tbody>${filas.map((a) => `<tr class="border-t border-slate-100 align-top">
        <td class="px-3 py-2 whitespace-nowrap">${fechaHora(a.fecha)}</td>
        <td class="px-3 py-2 font-bold">${esc(a.accion)}</td>
        <td class="px-3 py-2">${esc(a.email || cuentaDe(a.uid)?.email || a.uid || '')}</td>
        <td class="px-3 py-2 font-mono">${cambio(a)}</td>
        <td class="px-3 py-2">${esc(a.actor)}</td></tr>`).join('') || '<tr><td colspan="5" class="px-3 py-6 text-center text-slate-500">Sin cambios registrados.</td></tr>'}</tbody></table></div>`;
  } catch (e) { el.innerHTML = `<p class="text-sm text-red-600">${esc(e.message)}</p>`; }
}

function cambiarPestana(t) {
  pestana = t;
  document.querySelectorAll('.tab').forEach((b) => {
    const activa = b.dataset.tab === t;
    b.className = `tab px-3 py-2 border-b-2 ${activa ? 'border-amber-500 text-slate-900' : 'border-transparent text-slate-500'}`;
  });
  ['hoy', 'cuentas', 'tickets', 'errores', 'cobros', 'metricas', 'ia', 'auditoria'].forEach((x) => $('#tab-' + x).classList.toggle('hidden', x !== t));
  if (t === 'hoy') cargarHoy();
  if (t === 'cobros') cargarCobros();
  if (t === 'metricas') cargarMetricas();
  if (t === 'ia') cargarIA();
  if (t === 'tickets') cargarTickets();
  if (t === 'errores') cargarErrores();
  if (t === 'auditoria') cargarAuditoria();
}

document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => cambiarPestana(b.dataset.tab)));
['#buscar', '#filtro-modo', '#orden'].forEach((s) => $(s).addEventListener('input', pintarCuentas));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { cerrarPanel(); cerrarCrear(); } });
cambiarPestana('hoy');
cargar();
iconos();
</script>
</body>
</html>
